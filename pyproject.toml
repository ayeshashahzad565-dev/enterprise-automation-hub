[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-automation-hub"
version = "1.0.0"
description = "Enterprise Automation Hub (EAH) — a modular monolithic application for configurable approval workflows, built on FastAPI, Next.js, and Supabase."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [
    { name = "Enterprise Automation Hub Engineering" }
]

classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Groupware",
]

dependencies = [
    "supabase>=2.4,<3.0",
    "pydantic>=2.5,<3.0",
    "apscheduler>=3.10,<4.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "sentry-sdk>=2.0,<3.0",
    "redis>=5.0,<6.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "httpx>=0.27",
    "fakeredis[lua]>=2.20,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = [
    ".venv",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 (function-call-in-default-argument): Page() (base_repository.py)
# is a frozen, immutable dataclass with no shared mutable state, so
# `page: Page = Page()` — used throughout app.database.repositories and
# app.services — does not have the shared-mutable-default hazard this
# rule exists to catch.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# CountAggregator's key_fn intentionally takes Sequence[object] so one
# generic aggregator serves every unrelated record type (requests,
# workflow_stages, audit_logs, ...); getattr(obj, "literal_name") is
# deliberate duck-typed access here, not accidental indirection B009
# normally protects against — `ruff --fix` would otherwise rewrite these
# into `obj.literal_name`, which breaks mypy (object has no such attribute).
"app/analytics/aggregations.py" = ["B009"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
# 3.12, not the 3.11 floor in requires-python above: mypy applies this
# version gate to installed third-party stub files too, and numpy's
# stubs use PEP 695 `type` statements (3.12+ syntax), so 3.11 made mypy
# refuse to parse numpy's own .pyi and abort before checking any app code.
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = false