name: E2E

# Runs the Playwright suite (frontend/e2e/) against a real, ephemeral
# local Supabase stack — no hosted project, no secrets. See
# frontend/e2e/README.md for the equivalent local workflow.
#
# Separate from ci.yml: this job is heavier (spins up Postgres/Auth,
# migrates, seeds, builds, boots two servers) and would otherwise slow
# down that workflow's fast lint/typecheck/unit-test feedback loop.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This job only reads the repo and uploads its own build artifact
# (unaffected by this token's scope) — explicit least-privilege, matching
# cd.yml's own precedent.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENVIRONMENT: testing
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start --ignore-health-check

      - name: Export local Supabase connection details
        # `supabase status -o env` prints the same fixed local dev
        # keys every `supabase start` produces — never a secret, only
        # ever valid against this ephemeral, job-local instance.
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Seed E2E fixtures
        run: python scripts/seed_e2e_fixtures.py

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
