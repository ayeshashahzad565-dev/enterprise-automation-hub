[alembic]
# Per DSD Section 15 / Deployment Guide Section 11: this project's
# migration history lives under app/database/migrations, versioned
# against DATABASE_URL (the direct Postgres connection string), never
# against the Supabase client used by the running application.
script_location = app/database/migrations
prepend_sys_path = .
version_path_separator = os

# Left blank deliberately: app/database/migrations/env.py resolves the
# real connection string from the DATABASE_URL environment variable at
# run time (via python-dotenv, matching this project's existing
# convention in app/config/settings.py), so no connection string is
# ever committed to source control.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
