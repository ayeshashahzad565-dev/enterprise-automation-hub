[pytest]
minversion = 8.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers, matching the test organization in the Testing Strategy Document
markers =
    unit: fast, isolated unit tests (services, workflow engine, models, utils)
    integration: tests requiring a real, migrated Supabase test database
    api: contract tests against the documented REST specification
    security: RBAC, RLS, and injection-prevention tests
    performance: load, stress, and concurrency tests
    acceptance: end-to-end scenarios traced to the SRS

# Default run: fast unit suite only when filtered via -m unit;
# full suite (including integration/api/security/performance) runs by default.
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

filterwarnings =
    error
    ignore::DeprecationWarning:streamlit.*