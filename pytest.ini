[pytest]
minversion = 8.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers, matching the test organization in the Testing Strategy Document
markers =
    unit: fast, isolated unit tests (services, workflow engine, models, utils)
    integration: tests requiring a real, migrated Supabase test database
    api: contract tests against the documented REST specification
    security: RBAC, RLS, and injection-prevention tests
    performance: load, stress, and concurrency tests
    acceptance: end-to-end scenarios traced to the SRS

# Default run: fast unit suite only when filtered via -m unit;
# full suite (including integration/api/security/performance) runs by default.
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

filterwarnings =
    error
    ignore::DeprecationWarning:streamlit.*
    # FastAPI 0.116's routing internals still call the now-deprecated
    # asyncio.iscoroutinefunction (removed in Python 3.16). Python's
    # warnings module attributes the warning to its *caller's* module
    # (fastapi.routing, per stacklevel=3 in asyncio's own
    # warnings._deprecated call) rather than to asyncio itself — this is
    # an upstream FastAPI/Python-version interaction, not application
    # code, and promoting it to a hard error breaks every test that
    # imports app.api.main. Scoped to fastapi.* so a real
    # DeprecationWarning from this codebase's own code still fails the
    # suite as intended.
    ignore::DeprecationWarning:fastapi.*